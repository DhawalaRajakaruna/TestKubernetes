apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: testspace
spec:
  type: NodePort
  selector:
    app: testkube # this says only the pods with the label app: testkube will recieve traffic from this service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000 #This is the port on which the service will be exposed on each node in the cluster
                      # 
