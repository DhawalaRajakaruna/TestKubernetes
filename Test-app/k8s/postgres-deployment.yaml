apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: testspace
spec:  # Deployment specs
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template: # Pod template
    metadata:
      labels:
        app: postgres
    spec: # Pod spec
      containers:
      - name: postgres
        image: postgres:13-alpine
        ports:
          - containerPort: 5432
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: POSTGRES_DB
        volumeMounts:
          - name: db-storage
            mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
