{{- if and .Values.enabled.pvc .Values.database }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.database.pvc.name }}
  namespace: {{ .Values.namespaces.name }}
spec:
  accessModes:
    - {{ .Values.database.pvc.accessModes }}
  resources:
    requests:
      storage: {{ .Values.database.pvc.reqstorage }}
{{- end }}
