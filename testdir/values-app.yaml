deployments:
  name: app-deployment
  replicas: 2
  app: testkube

  container:
    name: testkube
    image: testkube_app:latest
    imagePullPolicy: Never
    port: 8000
  env:
    - name: DATABASE_URL
      value: postgresql://dhawala:123@database-service:5432/Testbase
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

services:
  name: app-service
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30000
  selector:
    app: testkube

namespaces:
  name: testspace
  create: false

hpa:
  name: app-hpa
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80  